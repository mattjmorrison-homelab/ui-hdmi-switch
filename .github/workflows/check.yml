name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check

      - name: Build and push the test-stage image
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: 'false'
          command: >-
            --context=git://github.com/mattjmorrison-homelab/ui-hdmi-switch.git#refs/heads/${{ github.head_ref }}
            --dockerfile=Dockerfile --skip-unused-stages=true --target=test --destination=registry.morrisons.site/ui-hdmi-switch-test:pr-${{ github.event.pull_request.head.sha }}
          secret-volume: ui-hdmi-switch-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: '1800'

      - name: Run tests inside the just-pushed PR-scoped test image
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: registry.morrisons.site/ui-hdmi-switch-test:pr-${{ github.event.pull_request.head.sha }}
          command: npm run test

      - name: Build and push the release image
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: 'false'
          command: >-
            --context=git://github.com/mattjmorrison-homelab/ui-hdmi-switch.git#refs/heads/${{ github.head_ref }}
            --dockerfile=Dockerfile --skip-unused-stages=true --target=release --build-arg=COMMIT_SHA=${{ github.event.pull_request.head.sha }} --destination=registry.morrisons.site/ui-hdmi-switch:pr-${{ github.event.pull_request.head.sha }}
          secret-volume: ui-hdmi-switch-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: '1800'

name: Publish

on:
  pull_request:
    types: [closed]

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Promote the PR's already-built image to the deployed tag
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: gcr.io/go-containerregistry/crane@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
          shell: 'false'
          command: >-
            tag registry.morrisons.site/ui-hdmi-switch:pr-${{ github.event.pull_request.head.sha }}
            ${{ github.event.pull_request.head.sha }}
          env: DOCKER_CONFIG=/kaniko/.docker
          secret-volume: ui-hdmi-switch-zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: '120'

      - run: sh scripts/verify-deploy.sh
        env:
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Smoke-test the deployed commit
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
          checkout-ref: ${{ github.event.pull_request.head.sha }}
          command: npm ci && npm run test:e2e:smoke

      - name: Notify Discord on failure
        if: failure()
        uses: mattjmorrison-homelab/actions-openbao@a9a15ee54f4b6a08b17ddd55df99d5109cfb5748 # main
        with:
          role: ui-hdmi-switch-discord
          kv-path: homelab/service/admin-discord/ui-hdmi-switch/webhook-url
          output-name: DISCORD_WEBHOOK_URL
      - if: failure()
        run: >-
          curl -sf -H "Content-Type: application/json" -X POST
          -d "{\"content\": \"🔴 **ui-hdmi-switch** build failed — ${{ github.event.pull_request.head.sha }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          "$DISCORD_WEBHOOK_URL"

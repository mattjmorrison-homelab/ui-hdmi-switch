name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and push the test-stage image
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: 'false'
          command: >-
            --context=git://github.com/mattjmorrison-homelab/ui-hdmi-switch.git#refs/heads/fix-kaniko-skip-unused-stages
            --dockerfile=Dockerfile --skip-unused-stages=true --force-build-metadata --target=test --destination=registry.morrisons.site/ui-hdmi-switch-test-debug:${{ github.sha }}
          secret-volume: zot-pull-secret:/kaniko/.docker
          active-deadline-seconds: "1800"

      - name: Run tests inside the just-built test image
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: registry.morrisons.site/ui-hdmi-switch-test:${{ github.sha }}
          command: npm ci && npm run check

      - name: Build and push the release image
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
          shell: 'false'
          command: >-
            --context=git://github.com/mattjmorrison-homelab/ui-hdmi-switch.git#refs/heads/main
            --dockerfile=Dockerfile --skip-unused-stages=true --target=release --build-arg=COMMIT_SHA=${{ github.sha }}
            --destination=registry.morrisons.site/ui-hdmi-switch:${{ github.sha }}
          secret-volume: zot-pull-secret:/kaniko/.docker

      - run: sh scripts/verify-deploy.sh
        env:
          CI_COMMIT_SHA: ${{ github.sha }}

      - name: Smoke-test the deployed commit
        uses: mattjmorrison-homelab/actions-k8s@15aea08ba0b53348f3e5ae7c0408dade247eff35 # main
        with:
          service-account: ui-hdmi-switch-job
          image: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
          checkout-ref: ${{ github.sha }}
          command: npm ci && npm run test:e2e:smoke

      - name: Notify Discord on failure
        if: failure()
        uses: mattjmorrison-homelab/actions-openbao@a9a15ee54f4b6a08b17ddd55df99d5109cfb5748 # main
        with:
          role: ui-hdmi-switch-discord
          kv-path: homelab/ui-hdmi-switch/discord-webhook-url
          output-name: DISCORD_WEBHOOK_URL
      - if: failure()
        run: >-
          curl -sf -H "Content-Type: application/json" -X POST
          -d "{\"content\": \"🔴 **ui-hdmi-switch** build failed — ${{ github.sha }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          "$DISCORD_WEBHOOK_URL"

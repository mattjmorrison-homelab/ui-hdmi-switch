enum HdmiInput {
  APPLE_TV
  PC
  SWITCH
  PS3
  PS4
  UNUSED_6
  UNUSED_7
  UNUSED_8
}

type Input {
  value: HdmiInput!
  label: String!
  icon: String!
  hoverText: String!
  isActive: Boolean!
}

type HdmiQuery {
  inputs: [Input!]!
}

type HdmiMutation {
  setInput(input: HdmiInput!): HdmiInput!
}

type Query {
  hdmi: HdmiQuery!
}

type Mutation {
  hdmi: HdmiMutation!
}

when:
  event: [push, manual]

steps:
  build-test:
    image: docker.io/woodpeckerci/plugin-kaniko:latest@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    settings:
      repo: ui-hdmi-switch-test
      registry: registry.morrisons.site
      dockerfile: Dockerfile
      target: test
      tags: ${CI_COMMIT_SHA}
      username: ci
      password:
        from_secret: zot_password

  test:
    image: registry.morrisons.site/ui-hdmi-switch-test:${CI_COMMIT_SHA}
    commands:
      - npm run check

  build-release:
    image: docker.io/woodpeckerci/plugin-kaniko:latest@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    settings:
      repo: ui-hdmi-switch
      registry: registry.morrisons.site
      dockerfile: Dockerfile
      target: release
      tags: ${CI_COMMIT_SHA}
      build_args:
        - COMMIT_SHA=${CI_COMMIT_SHA}
      username: ci
      password:
        from_secret: zot_password
    when:
      branch: main

  verify-deploy:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - sh scripts/verify-deploy.sh
    when:
      branch: main

  # Runs after verify-deploy confirms the right commit is live, so this test
  # isn't racing a rollout still in progress. Uses Microsoft's official
  # Playwright image (pinned to match @playwright/test in package.json) since
  # Playwright's Chromium build isn't supported on Alpine/musl.
  smoke-test-deploy:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    commands:
      - npm ci
      - npm run test:e2e:smoke
    when:
      branch: main

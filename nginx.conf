server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Let the service worker re-check for updates promptly instead of being
    # cached by an intermediate proxy or the browser's HTTP cache.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-screen SPA: no client-side router, but fall back to index.html
    # for anything unmatched rather than a bare 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
